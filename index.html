<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickLang</title>
    <!-- تضمين Tailwind CSS وأيقونات FontAwesome كما كانت في تطبيقك الأصلي -->
    <script src="https://tailwindcss.com"></script>
    <link href="https://cloudflare.com" rel="stylesheet">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 1. تكبير الشاشة الرئيسية وتوسيطها بشكل ممتاز */
        .app-container {
            width: 480px; /* تم التكبير ليكون أوضح وأكبر */
            height: 94vh; /* يغطي أغلب ارتفاع الشاشة */
            background-color: #000;
            border: 4px solid #1e1b4b; /* إطار داكن متناسق */
            border-radius: 24px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.2);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* تنسيق شريط التحكم السفلي الجديد */
        .navigation-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.9));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 50;
        }

        /* الأزرار الدائرية وتأثيراتها */
        .nav-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }

        .nav-btn:hover {
            transform: scale(1.1);
        }

        /* زر النشر: أسفل وفي الوسط تماماً باللون الأزرق */
        .publish-btn {
            background-color: #2563eb;
            font-size: 24px;
            position: absolute;
            left: 50%;
            transform: translate(-50%, -5px);
        }
        .publish-btn:hover {
            transform: translate(-50%, -5px) scale(1.1);
            background-color: #1d4ed8;
        }

        /* زر البروفايل: أسفل على اليمين باللون الرمادي الداكن */
        .profile-btn {
            background-color: #374151;
            margin-right: auto;
        }

        /* زر المنزل (الرئيسي): أسفل على اليسار باللون البنفسجي */
        .home-btn {
            background-color: #4f46e5;
            margin-left: auto;
        }
    </style>
</head>
<body>

    <!-- الشاشة الرئيسية المكبرة والمحسنة -->
    <div class="app-container">
        
        <!-- المحتوى الأصلي الخاص بتطبيقك (تم الحفاظ عليه كاملاً) -->
        <div id="authScreen" class="absolute inset-0 bg-black flex flex-col justify-center items-center p-6 z-40 hide-scrollbar overflow-y-auto">
            <div class="w-full max-w-sm bg-neutral-900 border border-neutral-800 p-8 rounded-2xl text-center shadow-2xl">
                <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-bold text-2xl text-white">L</i>
                </div>
                <h1 class="text-2xl font-bold mb-2">منصة تعلم اللغات</h1>
                <p class="text-neutral-400 text-sm mb-6">فيديوهات قصيرة لتعلم اللغات بدون تشتيت أو إعلانات</p>
                
                <input id="usernameInput" type="text" placeholder="اسم المستخدم" class="w-full bg-neutral-800 border border-neutral-700 p-4 rounded-xl text-white placeholder-neutral-500 focus:outline-none focus:border-indigo-500 mb-4">
                
                <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
                    إنشاء حساب ودخول
                </button>
            </div>
        </div>

        <!-- شريط الأزرار الجديد والموزع بدقة حسب طلبك -->
        <div class="navigation-bar">
            <!-- زر البروفايل (على اليمين) -->
            <div class="nav-btn profile-btn" title="الملف الشخصي">
                <i class="fa-solid fa-user"></i>
            </div>
            
            <!-- زر النشر (في أسفل الوسط) -->
            <div class="nav-btn publish-btn" title="نشر">
                <i class="fa-solid fa-plus"></i>
            </div>
            
            <!-- زر المنزل / الرئيسي (على اليسار) -->
            <div class="nav-btn home-btn" title="الرئيسية">
                <i class="fa-solid fa-house"></i>
            </div>
        </div>

    </div>

    <script>
        // دالة الدخول الخاصة بتطبيقك الأصلي لحفظ اسم المستخدم
        function login() {
            const username = document.getElementById('usernameInput').value;
            if(username.trim() !== "") {
                document.getElementById('authScreen').style.display = 'none';
                // هنا يتم تشغيل بقية الكود التلقائي للموقع لاحقاً
            } else {
                alert("الرجاء إدخال اسم المستخدم");
            }
        }
    </script>
</body>
</html>
