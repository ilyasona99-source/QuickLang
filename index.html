<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق تعلم اللغات</title>
    <!-- Tailwind CSS جاهز عبر CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-center items-center">

    <!-- 1. شاشة تسجيل الدخول / إنشاء الحساب -->
    <div id="authScreen" class="fixed inset-0 z-50 bg-black flex flex-col justify-center items-center p-6">
        <div class="w-full max-w-sm bg-neutral-900 border border-neutral-800 p-8 rounded-2xl text-center shadow-2xl">
            <div class="w-16 h-16 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/30">
                <i class="fa-solid font-bold text-2xl text-white">L</i>
            </div>
            <h1 class="text-2xl font-bold mb-2">منصة تعلم اللغات</h1>
            <p class="text-neutral-400 text-sm mb-6">فيديوهات قصيرة لتعلم اللغات بدون تشتيت أو إعلانات</p>
            
            <input id="usernameInput" type="text" placeholder="اسم المستخدم" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl px-4 py-3 mb-4 text-white placeholder-neutral-500 focus:outline-none focus:border-indigo-500 transition">
            
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition shadow-lg shadow-indigo-600/30">
                إنشاء حساب ودخول
            </button>
        </div>
    </div>

    <!-- 2. الواجهة الرئيسية للتطبيق -->
    <div id="appScreen" class="hidden w-full h-full flex flex-col md:flex-row max-w-5xl justify-center items-center relative">
        
        <!-- الشريط الجانبي / السفلي للشاشات -->
        <div class="fixed bottom-0 md:relative md:bottom-auto w-full md:w-20 bg-neutral-900/80 backdrop-blur-md md:bg-transparent border-t md:border-t-0 border-neutral-800 z-40 flex md:flex-col justify-around md:justify-center items-center py-3 md:space-y-8">
            <!-- زر الرئيسية -->
            <button class="text-indigo-500 text-xl"><i class="fa-solid fa-house"></i></button>
            
            <!-- زر نشر فيديو -->
            <button onclick="openUploadModal()" class="bg-indigo-600 text-white w-12 h-12 rounded-full flex items-center justify-center text-xl shadow-lg shadow-indigo-600/40 hover:scale-105 transition">
                <i class="fa-solid fa-plus"></i>
            </button>
            
            <!-- زر الحساب الشخصي -->
            <button onclick="openProfileModal()" class="text-neutral-400 hover:text-white text-xl"><i class="fa-solid fa-user"></i></button>
        </div>

        <!-- مشغل الفيديوهات (المنتصف) -->
        <div class="w-full h-full md:h-[90vh] md:w-[420px] bg-neutral-900 relative rounded-none md:rounded-2xl overflow-hidden shadow-2xl flex justify-center items-center">
            
            <!-- الفيديو الرئيسي -->
            <video id="videoPlayer" class="w-full h-full object-cover" loop controls autoplay muted></video>

            <!-- معلومات الفيديو فوق الفيديو -->
            <div class="absolute bottom-6 right-4 left-4 z-20 pointer-events-none text-right">
                <span id="videoLang" class="bg-indigo-600/80 backdrop-blur-md text-white text-xs px-3 py-1 rounded-full font-semibold">الإنجليزية</span>
                <h3 id="videoAuthor" class="text-white font-bold mt-2">@user</h3>
                <p id="videoDesc" class="text-neutral-200 text-sm mt-1">شرح سريع للقواعد</p>
            </div>

            <!-- أزرار التنقل بين الفيديوهات -->
            <div class="absolute left-4 top-1/2 -translate-y-1/2 flex flex-col space-y-4 z-20">
                <button onclick="prevVideo()" class="w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white hover:bg-black/70"><i class="fa-solid fa-chevron-up"></i></button>
                <button onclick="nextVideo()" class="w-10 h-10 bg-black/40 backdrop-blur-md border border-white/10 rounded-full flex items-center justify-center text-white hover:bg-black/70"><i class="fa-solid fa-chevron-down"></i></button>
            </div>
        </div>
    </div>

    <!-- 3. نافذة نشر فيديو جديد -->
    <div id="uploadModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md p-6 rounded-2xl text-right">
            <h2 class="text-xl font-bold mb-4">نشر مقطع تعليمي</h2>
            
            <label class="block text-sm text-neutral-400 mb-2">اختر الفيديو من جهازك:</label>
            <input id="videoFileInput" type="file" accept="video/*" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-2 mb-4 text-sm text-neutral-300">
            
            <label class="block text-sm text-neutral-400 mb-2">اللغة المُدرّسة:</label>
            <select id="videoLangInput" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 mb-4 text-white">
                <option value="الإنجليزية">الإنجليزية</option>
                <option value="الفرنسية">الفرنسية</option>
                <option value="الإسبانية">الإسبانية</option>
                <option value="الألمانية">الألمانية</option>
            </select>

            <label class="block text-sm text-neutral-400 mb-2">وصف قصير للدرس:</label>
            <textarea id="videoDescInput" rows="2" placeholder="ماذا سيتعلم الطالب من هذا المقطع؟" class="w-full bg-neutral-800 border border-neutral-700 rounded-xl p-3 mb-6 text-white text-sm"></textarea>

            <div class="flex space-x-3 space-x-reverse">
                <button onclick="publishVideo()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold">نشر الآن</button>
                <button onclick="closeUploadModal()" class="px-5 bg-neutral-800 text-neutral-300 py-3 rounded-xl">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- 4. نافذة الحساب الشخصي -->
    <div id="profileModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex justify-center items-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-md p-6 rounded-2xl text-center">
            <div class="w-20 h-20 bg-neutral-800 border-2 border-indigo-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl font-bold text-indigo-400" id="profileAvatar">U</div>
            <h2 id="profileUsername" class="text-xl font-bold">@username</h2>
            <p class="text-xs text-neutral-400 mt-1">حساب صانع محتوى تعليمي</p>
            
            <div class="flex justify-around my-6 bg-neutral-800/50 p-4 rounded-xl border border-neutral-800">
                <div>
                    <span id="uploadedCount" class="block text-lg font-bold text-white">0</span>
                    <span class="text-xs text-neutral-400">فيديوهات منشورة</span>
                </div>
            </div>

            <button onclick="closeProfileModal()" class="w-full bg-neutral-800 text-white py-2.5 rounded-xl text-sm">إغلاق</button>
        </div>
    </div>

    <!-- البرمجة والمنطق -->
    <script>
        let currentUser = "";
        let videos = [
            {
                url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
                author: "@EnglishMaster",
                lang: "الإنجليزية",
                desc: "تعلم أهم 3 عبارات مستعملة في الحياة اليومية!"
            }
        ];
        let currentVideoIndex = 0;

        function login() {
            const input = document.getElementById('usernameInput').value.trim();
            if(!input) return alert('يرجى كتابة اسم المستخدم');
            currentUser = input.startsWith('@') ? input : '@' + input;
            
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('appScreen').classList.remove('hidden');
            loadVideo(0);
        }

        function loadVideo(index) {
            if(videos.length === 0) return;
            currentVideoIndex = index;
            const v = videos[index];
            const player = document.getElementById('videoPlayer');
            player.src = v.url;
            document.getElementById('videoAuthor').innerText = v.author;
            document.getElementById('videoLang').innerText = v.lang;
            document.getElementById('videoDesc').innerText = v.desc;
            player.play();
        }

        function nextVideo() {
            if (currentVideoIndex < videos.length - 1) loadVideo(currentVideoIndex + 1);
        }

        function prevVideo() {
            if (currentVideoIndex > 0) loadVideo(currentVideoIndex - 1);
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

        function openProfileModal() {
            document.getElementById('profileUsername').innerText = currentUser;
            document.getElementById('profileAvatar').innerText = currentUser.charAt(1).toUpperCase();
            
            const myVideos = videos.filter(v => v.author === currentUser).length;
            document.getElementById('uploadedCount').innerText = myVideos;
            
            document.getElementById('profileModal').classList.remove('hidden');
        }
        function closeProfileModal() { document.getElementById('profileModal').classList.add('hidden'); }

        function publishVideo() {
            const fileInput = document.getElementById('videoFileInput');
            const lang = document.getElementById('videoLangInput').value;
            const desc = document.getElementById('videoDescInput').value;

            if(!fileInput.files[0]) return alert('يرجى اختيار فيديو من جهازك أولاً');

            const videoUrl = URL.createObjectURL(fileInput.files[0]);
            
            videos.unshift({
                url: videoUrl,
                author: currentUser,
                lang: lang,
                desc: desc || "مقطع تعليمي جديد"
            });

            closeUploadModal();
            loadVideo(0);
            alert('تم نشر الفيديو بنجاح!');
        }
    </script>
</body>
</html>
